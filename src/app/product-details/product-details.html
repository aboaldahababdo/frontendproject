@if (product) {
  <div class="container my-5">
    <div class="row">
      <div class="col-md-5">
        <img [src]="product.thumbnail" class="img-fluid rounded" [alt]="product.title">
      </div>

      <div class="col-md-7">
        <h2>{{ product.title }}</h2>
        <p class="text-muted text-capitalize">{{ product.category }}</p>
        <h3 class="text-danger">{{ product.price }} $</h3>
        <p>{{ product.description }}</p>

        <button class="btn btn-dark"  (click)="addToCart()">Add to cart</button>
      </div>
    </div>
  </div>
}
